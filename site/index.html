<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Momoro</title>
  <meta name="description" content="Momoro — cute 3D mascot avatars. Roll a random one, or browse them all.">
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- inline icon symbols -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-github" viewBox="0 0 24 24"><path fill="currentColor" d="M12 .5C5.73.5.5 5.73.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.28-.01-1.02-.02-2-3.2.7-3.88-1.54-3.88-1.54-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.67 0-1.25.45-2.28 1.19-3.08-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.8 1.19 1.83 1.19 3.08 0 4.4-2.69 5.37-5.25 5.66.41.35.78 1.05.78 2.12 0 1.53-.01 2.76-.01 3.14 0 .31.21.68.8.56C20.71 21.39 24 17.08 24 12 24 5.73 18.77.5 12 .5z"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.7 2.6 15.3 0 18M12 3c-2.6 2.7-2.6 15.3 0 18"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 20h14"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M4 4l5 5M15 15l6 6M21 16v5h-5"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
  </svg>

  <!-- nav -->
  <nav class="nav">
    <a class="brand" href="./"><img src="logo.png" alt=""><span class="name serif" id="brandName">Momoro</span></a>
    <div class="nav-right">
      <a class="glass-btn" id="ghLink" href="#" target="_blank" rel="noopener">
        <svg class="ico"><use href="#i-github"/></svg><span class="txt" id="ghText">View on GitHub</span>
      </a>
      <button class="glass-btn" id="collBtn">
        <svg class="ico" style="fill:none;stroke:currentColor;stroke-width:2"><use href="#i-heart"/></svg>
        <span class="txt" id="collText">My Collection</span>
        <span class="badge" id="favBadge" style="display:none">0</span>
      </button>
      <button class="glass-btn" id="langBtn">
        <svg class="ico"><use href="#i-globe"/></svg><span id="langText">中文</span>
      </button>
      <button class="glass-btn" id="themeBtn" title="Theme">
        <svg class="ico"><use id="themeUse" href="#i-moon"/></svg><span class="txt" id="themeText"></span>
      </button>
    </div>
  </nav>

  <main>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty"></div>
  </main>

  <footer id="footer"></footer>

  <!-- detail modal -->
  <div class="lb" id="lb">
    <div class="backdrop" id="lbBackdrop"></div>
    <div class="counter" id="lbCounter"></div>
    <button class="close" id="lbClose" aria-label="Close">✕</button>
    <button class="arrow prev" id="lbPrev" aria-label="Previous">‹</button>
    <button class="arrow next" id="lbNext" aria-label="Next">›</button>
    <div class="stage">
      <div class="panel">
        <div class="preview"><img id="lbImg" src="" alt=""></div>
        <div class="meta">
          <div class="info"><div class="n serif" id="lbName"></div><div class="c" id="lbCat"></div></div>
          <button class="glass-btn fav" id="lbFav">
            <svg class="ico" style="fill:none;stroke:currentColor;stroke-width:2"><use href="#i-heart"/></svg>
            <span class="lbl"></span>
          </button>
          <a class="glass-btn dl" id="lbDownload" href="#" download>
            <svg class="ico"><use href="#i-download"/></svg><span id="lbDlText"></span>
          </a>
        </div>
        <div class="rand-row" id="randRow">
          <button class="glass-btn" id="btnDislike"><span id="dislikeText">Nope</span></button>
          <button class="glass-btn like" id="btnLike"><span id="likeText">Love it</span></button>
        </div>
      </div>
    </div>
  </div>

  <!-- floating random trigger (fixed layer) -->
  <button class="fab-random" id="randomBtn">
    <svg class="ico"><use href="#i-shuffle"/></svg><span id="randomText">Surprise me</span>
  </button>

  <script src="app.js"></script>
</body>
</html>
